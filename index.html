<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Thư viện văn bản xây dựng</title><meta name="description" content="Thư viện tra cứu luật, nghị định, thông tư, QCVN, TCVN về kiến trúc và xây dựng tại Việt Nam."><link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@200;300;400;500&display=swap" rel="stylesheet"><style id="css">/* Layout: một phòng đọc trắng, các tầng kệ là những mặt phẳng mảnh nổi trong không khí; quyền lực văn bản = độ đậm của gáy (Luật đậm nhất, TCVN nhạt nhất). */
:root{
  color-scheme:light;
  --paper:#f5f5f3; --wall:#fbfbfa; --ink:#26292b; --muted:#878b8e; --hair:#e0e1e0; --shelf:#c9cbcb;
  --glass:rgba(252,252,251,.86);
  --t-luat:#5b5f62; --t-nd:#878b8d; --t-tt:#b0b3b3; --t-qc:#d0d1cf; --t-tc:#e8e7e2;
  --fix:#bf4d2d; --rev:#c09634; --okm:#55595c;
  --display:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  --body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-weight:300;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:1px solid var(--ink);outline-offset:3px}
a{color:inherit;text-decoration-thickness:1px;text-underline-offset:3px}

/* ---------- header ---------- */
.top{position:sticky;top:0;z-index:5;background:linear-gradient(to bottom,rgba(245,245,243,.97) 70%,rgba(245,245,243,0));padding:28px 0 18px}
.wrap{max-width:1240px;margin:0 auto;padding:0 28px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:200;font-size:40px;line-height:1.05;letter-spacing:-.01em;margin:0;text-wrap:balance}
h1 b{font-weight:400}
.sub{color:var(--muted);font-size:13px;margin:6px 0 0;font-variant-numeric:tabular-nums}
.addb{font-size:13px;color:var(--muted);border-bottom:1px solid var(--hair);padding:2px 0}
.addb:hover{color:var(--ink);border-color:var(--ink)}
.search{position:relative;margin-top:22px}
#q{width:100%;font:inherit;font-size:20px;font-weight:300;color:var(--ink);background:transparent;border:0;border-bottom:1px solid var(--shelf);padding:10px 0 10px;border-radius:0;outline:none}
#q:focus{border-bottom-color:var(--ink)}
#q::placeholder{color:#aeb1b3}
.hint{position:absolute;right:0;top:16px;font-size:12px;color:var(--muted);pointer-events:none;font-variant-numeric:tabular-nums}
#res{position:absolute;left:0;right:0;top:100%;margin:0;padding:6px 0;list-style:none;background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(0,0,0,.06);display:none;max-height:min(420px,60vh);overflow:auto;z-index:6}
#res.on{display:block}
#res li button{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:baseline;width:100%;text-align:left;padding:9px 16px}
#res li button[aria-selected="true"],#res li button:hover{background:rgba(0,0,0,.035)}
#res .rn{font-weight:500;white-space:nowrap;font-variant-numeric:tabular-nums}
#res .rt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#res .rk{font-size:12px;color:var(--muted);white-space:nowrap}
#res .none{padding:10px 16px;color:var(--muted)}
.filters{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;-webkit-mask-image:linear-gradient(to right,#000 calc(100% - 48px),transparent);mask-image:linear-gradient(to right,#000 calc(100% - 48px),transparent);padding-right:40px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;font-size:12.5px;padding:5px 12px;border:1px solid var(--hair);border-radius:999px;color:#5d6164;white-space:nowrap;background:rgba(255,255,255,.5)}
.chip:hover{border-color:var(--shelf)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fafaf8}
.chip i{font-style:normal;opacity:.6;margin-left:5px;font-variant-numeric:tabular-nums}

/* ---------- room ---------- */
main{padding:10px 0 40px;transition:padding .35s ease}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:4px 0 26px}
.legend span{display:inline-flex;align-items:center;gap:7px}
.lg{display:inline-block;width:9px;height:16px;border-radius:1px}
.tier{display:grid;grid-template-columns:170px 1fr;gap:28px;padding:34px 0 44px;border-top:1px solid var(--hair)}
.tl .no{display:block;font-weight:200;font-size:44px;line-height:1;color:#b9bcbd;font-variant-numeric:tabular-nums}
.tl b{display:block;font-weight:400;font-size:19px;margin-top:10px}
.tl small{display:block;color:var(--muted);font-size:12.5px;margin-top:6px;max-width:22ch}
.shelf{display:flex;flex-wrap:wrap;gap:30px 40px;align-items:flex-end}
.grp{display:flex;flex-direction:column;gap:10px;min-width:0}
.gl{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:400}
.gl i{font-style:normal;opacity:.6;margin-left:6px}
.books{display:flex;flex-wrap:wrap;row-gap:24px}
.slot{height:var(--h);display:flex;align-items:flex-end;padding:0 1.5px;border-bottom:2px solid var(--shelf)}

/* ---------- spine ---------- */
.spine{position:relative;width:var(--w);height:var(--sh);background:var(--c);color:var(--tx);border-radius:1px;display:flex;flex-direction:column;align-items:center;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.05);filter:brightness(var(--j));transition:transform .28s cubic-bezier(.2,.7,.2,1),opacity .28s,box-shadow .28s}
.spine:hover{transform:translateY(-5px)}
.spine .v{writing-mode:vertical-rl;transform:rotate(180deg);flex:1 1 auto;min-height:0;width:100%;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:5px;padding:22px 0 10px;overflow:hidden}
.spine .no,.spine .nm{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-height:100%}
.spine .no{font-weight:500;font-size:12.5px;letter-spacing:.03em}
.spine .nm{font-weight:300;font-size:10.5px;opacity:.85}
.spine .tc{font-size:8.5px;letter-spacing:.12em;font-weight:500;padding-top:9px;opacity:.65}
.spine.thin .v{padding:12px 0 10px}
.spine.thin .no{font-size:9.5px;font-weight:400}
.spine.het{background:rgba(255,255,255,.35);color:#a2a6a8;box-shadow:inset 0 0 0 1px var(--hair);filter:none}
.spine.sap{background:rgba(255,255,255,.5);color:var(--ink);box-shadow:none;outline:1px dashed #9a9ea0;outline-offset:-1px;filter:none}
.rb{position:absolute;top:0;right:6px;width:6px;height:17px;clip-path:polygon(0 0,100% 0,100% 100%,50% 74%,0 100%)}
.vf{position:absolute;bottom:8px;left:50%;width:6px;height:6px;margin-left:-3px;border:1px solid currentColor;border-radius:50%;opacity:.75}
.spine.dim{opacity:.1}
.spine.hit{box-shadow:0 0 0 1px var(--ink)}
.spine[aria-current="true"]{transform:translateY(-16px);box-shadow:0 18px 22px -16px rgba(0,0,0,.45),0 0 0 1px var(--ink);opacity:1}
@media (prefers-reduced-motion:reduce){.spine,main,#panel{transition:none!important}}

/* ---------- reading panel ---------- */
#panel{position:fixed;top:18px;right:18px;bottom:18px;width:min(410px,calc(100% - 36px));z-index:7;background:var(--glass);backdrop-filter:blur(22px) saturate(1.05);-webkit-backdrop-filter:blur(22px);
  border:1px solid rgba(0,0,0,.06);padding:30px 30px 26px;overflow:auto;transform:translateX(calc(100% + 40px));transition:transform .4s cubic-bezier(.2,.7,.2,1);display:flex;flex-direction:column;gap:16px}
#panel.on{transform:none}
.x{position:absolute;top:14px;right:16px;font-size:22px;font-weight:200;color:var(--muted);width:34px;height:34px}
.x:hover{color:var(--ink)}
.pk{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:400}
.pno{font-weight:200;font-size:30px;line-height:1.1;letter-spacing:-.005em;margin:0;padding-right:30px;overflow-wrap:anywhere}
.pt{font-weight:400;font-size:16.5px;line-height:1.45;margin:0;text-wrap:balance}
.stl{display:flex;align-items:center;gap:8px;font-size:13px}
.sd{width:8px;height:8px;border-radius:50%}
.chk{border-left:2px solid;padding:8px 12px;font-size:14px;background:rgba(255,255,255,.6)}
.chk b{font-weight:500}
dl{margin:0;display:grid;grid-template-columns:92px 1fr;gap:7px 14px;font-size:14px}
dt{color:var(--muted)}dd{margin:0;min-width:0;overflow-wrap:anywhere}
.ln{border-bottom:1px solid var(--shelf);font-weight:400}
.ln:hover{border-color:var(--ink)}
.rel{display:flex;flex-direction:column;gap:6px;font-size:14px}
.rel .rh{color:var(--muted);font-size:12px}
.rel button{text-align:left;display:flex;gap:10px;align-items:baseline;padding:6px 0;border-top:1px solid var(--hair)}
.rel button span:first-child{font-weight:500;white-space:nowrap}
.rel button span:last-child{color:#5d6164;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.warn{font-size:13px;color:#6b6f72;border-top:1px solid var(--hair);padding-top:10px}
.pa{display:flex;gap:18px;align-items:center;margin-top:auto;padding-top:8px;font-size:13.5px}
.pa a,.pa button{border-bottom:1px solid var(--ink);padding-bottom:1px;text-decoration:none}
.pa button.q{border-color:var(--hair);color:var(--muted)}

/* ---------- footer, dialog, toast ---------- */
.foot{font-size:12.5px;color:var(--muted);border-top:1px solid var(--hair);padding:18px 0 40px;max-width:70ch}
dialog{border:1px solid rgba(0,0,0,.08);border-radius:2px;background:var(--wall);color:var(--ink);padding:24px;width:min(580px,calc(100vw - 24px));max-height:calc(100% - 24px)}
dialog::backdrop{background:rgba(245,245,243,.7);backdrop-filter:blur(6px)}
form{display:flex;flex-direction:column;gap:12px}
form h2{margin:0 0 4px;font-weight:200;font-size:26px}
label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted)}
input,select,textarea{font:inherit;font-weight:300;color:var(--ink);background:#fff;border:1px solid var(--hair);border-radius:2px;padding:8px 10px;width:100%}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn{padding:9px 16px;border:1px solid var(--shelf);border-radius:2px;font-size:14px}
.btn.pri{background:var(--ink);border-color:var(--ink);color:#fafaf8}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fafaf8;padding:9px 16px;font-size:13px;max-width:calc(100vw - 32px);display:none;z-index:9}

@media (min-width:1180px){body.reading main{padding-right:430px}}
@media (max-width:760px){
  .wrap{padding:0 16px}
  h1{font-size:31px}
  .tier{grid-template-columns:1fr;gap:16px;padding:26px 0 34px}
  .tl{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
  .tl .no{font-size:28px}.tl b{margin:0}.tl small{max-width:none;width:100%;margin:0}
  .shelf{gap:26px 26px}
  .top{position:relative}
  .spine{scroll-margin-top:28px}
  #panel{top:auto;left:0;right:0;bottom:0;width:auto;max-height:60%;transform:translateY(105%);border-width:1px 0 0}
  .two{grid-template-columns:1fr}
  .hint{display:none}
}

  TIERS.forEach(function(t,i){
    var all=state.docs.filter(function(d){return d.t===t.k});
    html+='<section class="tier" data-tier="'+t.k+'"><div class="tl"><span class="no">0'+(i+1)+'</span><b>'+t.n+'</b><small>'+esc(t.d)+' <span class="tc-n">'+all.length+' cuốn</span>.</small></div><div class="shelf">';
    if(!all.length)html+='<span class="gl">Tầng này chưa có cuốn nào.</span>';
    LVO.forEach(function(k){
      var g=all.filter(function(d){return d.lv===k});if(!g.length)return;
      var order=[];g.forEach(function(d){if(!d.of||!byId(d.of)||byId(d.of).t!==t.k||byId(d.of).lv!==k)order.push(d)});
      var placed={};order=order.reduce(function(a,d){a.push(d);placed[d.id]=1;g.forEach(function(x){if(x.of===d.id){a.push(x);placed[x.id]=1}});return a},[]);
      g.forEach(function(d){if(!placed[d.id])order.push(d)});
      html+='<div class="grp" data-lv="'+k+'"><span class="gl">'+LV[k]+'<i>'+g.length+'</i></span><div class="books">';
      order.forEach(function(d){html+=spine(d,t)});
      html+='</div></div>';
    });
    html+='</div></section>';
  });
  $('#room').innerHTML=html;
  var c={hl:0,sap:0,het:0};state.docs.forEach(function(d){c[d.st]=(c[d.st]||0)+1});
  $('#sub').textContent=state.docs.length+' cuốn · '+c.hl+' đang hiệu lực · '+c.sap+' sắp hiệu lực · '+c.het+' hết hiệu lực · rà ngày '+state.checked;
  counts();apply();
  if(sel)mark(sel);
}
function spine(d,t){
  var thin=!!d.of,h=hash(d.id),w=thin?17:t.w+Math.min(14,Math.round((d.ten||'').length/10)),sh=thin?t.h-36:t.h-(h%6)*5,j=(0.965+((h>>4)%8)*0.01).toFixed(3);
  var cls='spine'+(thin?' thin':'')+(d.st==='het'?' het':d.st==='sap'?' sap':'');
  var no=thin?(d.gay||'Sửa đổi'):d.so.replace(/^(QCVN|QCXDVN|TCVN|TCXD) /,'');
  return '<div class="slot" style="--h:'+t.h+'px"><button class="'+cls+'" id="b-'+esc(d.id)+'" data-id="'+esc(d.id)+'" style="--w:'+w+'px;--sh:'+sh+'px;--c:var('+t.tone+');--tx:'+t.tx+';--j:'+j+'" aria-label="'+esc(d.so+'. '+d.ten+'. '+ST[d.st][0])+'">'+
   (thin?'':'<span class="tc">'+t.c+'</span>')+
   (d.hs?'<span class="rb" style="background:'+(DK[d.dk]||DK.ok)[1]+'"></span>':'')+
   '<span class="v"><span class="no">'+esc(no)+'</span>'+(thin?'':'<span class="nm">'+esc(d.gay||d.ten)+'</span>')+'</span>'+
   (d.src==='B'?'<span class="vf"></span>':'')+'</button></div>';
}
function counts(){
  $$('#lvc .chip').forEach(function(b){var k=b.dataset.lv;if(!k)return;b.querySelector('i').textContent=state.docs.filter(function(d){return d.lv===k}).length});
  $$('#flc .chip').forEach(function(b){var k=b.dataset.fl;if(!k)return;var save=fl;fl=k;var n=state.docs.filter(function(d){var o=lv;lv='';var r=passFilter(d);lv=o;return r}).length;fl=save;b.querySelector('i').textContent=n});
}
/* ---------- search + filter: dim, never reflow ---------- */
function apply(){
  hits={};list=[];
  state.docs.forEach(function(d){
    var ok=passFilter(d),s=ok?(q?score(d,q):1):0;
    if(s>0){hits[d.id]=s;if(q)list.push(d)}
  });
  list.sort(function(a,b){return hits[b.id]-hits[a.id]||TI[a.t]-TI[b.t]});
  var any=q||lv||fl;
  state.docs.forEach(function(d){var el=document.getElementById('b-'+d.id);if(!el)return;
    el.classList.toggle('dim',!!any&&!hits[d.id]);el.classList.toggle('hit',!!q&&!!hits[d.id])});
  $$('.tier').forEach(function(s){var k=s.dataset.tier,all=state.docs.filter(function(d){return d.t===k}),n=all.filter(function(d){return hits[d.id]}).length;
    s.querySelector('.tc-n').textContent=any?n+'/'+all.length+' cuốn khớp':all.length+' cuốn'});
  $('#hint').textContent=q?(list.length?list.length+' cuốn khớp':'Không có cuốn nào khớp'):'Bấm / để tìm';
  results();
}
function results(){
  var r=$('#res');ai=list.length?0:-1;
  if(!q){r.classList.remove('on');$('#q').setAttribute('aria-expanded','false');return}
  if(!list.length){r.innerHTML='<li class="none">Không có cuốn nào khớp "'+esc(q)+'". Thử bỏ dấu hoặc gõ số hiệu ngắn hơn.</li>'}
  else r.innerHTML=list.slice(0,8).map(function(d,i){return '<li><button type="button" role="option" data-go="'+esc(d.id)+'" aria-selected="'+(i===0)+'"><span class="rn">'+esc(d.so)+'</span><span class="rt">'+esc(d.ten)+'</span><span class="rk">'+TIERS[TI[d.t]].n+'</span></button></li>'}).join('')+
    (list.length>8?'<li class="none">và '+(list.length-8)+' cuốn khác đang sáng trên kệ</li>':'');
  r.classList.add('on');$('#q').setAttribute('aria-expanded','true');
}
function moveSel(k){var b=$$('#res [data-go]');if(!b.length)return;ai=(ai+k+b.length)%b.length;b.forEach(function(x,i){x.setAttribute('aria-selected',String(i===ai))});b[ai].scrollIntoView({block:'nearest'})}
/* ---------- open a book ---------- */
function mark(id){$$('.spine[aria-current]').forEach(function(e){e.removeAttribute('aria-current')});var el=document.getElementById('b-'+id);if(el)el.setAttribute('aria-current','true');return el}
function open(id,fromSearch){
  var d=byId(id);if(!d)return;sel=id;
  if(lv&&d.lv!==lv||fl&&!passFilter(d)){lv='';fl='';syncChips();apply()}
  panel(d);document.body.classList.add('reading');
  var el=mark(id);
  try{history.replaceState(null,'','#'+id)}catch(e){}
  setTimeout(function(){if(el){el.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:matchMedia('(max-width:760px)').matches?'start':'center',inline:'nearest'});if(!fromSearch)el.focus({preventScroll:true})}},60);
}
function close(){var id=sel;sel=null;$('#panel').classList.remove('on');document.body.classList.remove('reading');mark('');try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}
  var el=id&&document.getElementById('b-'+id);if(el)el.focus({preventScroll:true})}
function linkify(text,self){
  var s=esc(text),tok=[];
  state.docs.slice().sort(function(a,b){return b.so.length-a.so.length}).forEach(function(o){
    if(o.id===self||o.so.length<6)return;var e=esc(o.so);if(s.indexOf(e)<0)return;
    s=s.split(e).join('\u0001'+tok.length+'\u0001');tok.push('<button class="ln" data-go="'+esc(o.id)+'">'+e+'</button>');
  });
  return s.replace(/\u0001(\d+)\u0001/g,function(m,i){return tok[+i]});
}
function related(d){
  var g=[];
  var p=d.of&&byId(d.of);if(p)g.push(['Sửa đổi cho',[p]]);
  var am=state.docs.filter(function(x){return x.of===d.id});if(am.length)g.push(['Được sửa đổi bởi',am]);
  var rb=state.docs.filter(function(x){return x.id!==d.id&&x.thay&&x.thay.indexOf(d.so)>=0});if(rb.length)g.push(['Bị thay bởi',rb]);
  var rp=state.docs.filter(function(x){return x.id!==d.id&&d.thay&&x.so.length>=6&&d.thay.indexOf(x.so)>=0});if(rp.length)g.push(['Thay cho',rp]);
  if(!g.length)return '';
  return '<div class="rel">'+g.map(function(x){return '<span class="rh">'+x[0]+'</span>'+x[1].map(function(o){return '<button data-go="'+esc(o.id)+'"><span>'+esc(o.so)+'</span><span>'+esc(o.gay||o.ten)+'</span></button>'}).join('')}).join('')+'</div>';
}
function panel(d){
  var t=TIERS[TI[d.t]],k=DK[d.dk];
  var r=function(a,b){return b?'<dt>'+a+'</dt><dd>'+b+'</dd>':''};
  var url=d.url&&/^https?:\/\//.test(d.url)?d.url:'';
  var host='';try{host=url?new URL(url).hostname.replace(/^www\./,''):''}catch(e){}
  $('#panel').innerHTML='<button class="x" id="px" aria-label="Đóng">×</button>'+
   '<span class="pk">Tầng 0'+(TI[d.t]+1)+' · '+t.n+' · '+esc(LV[d.lv]||'')+'</span>'+
   '<h2 class="pno">'+esc(d.so)+'</h2><p class="pt">'+esc(d.ten)+'</p>'+
   '<div class="stl"><i class="sd" style="background:'+ST[d.st][1]+'"></i>'+ST[d.st][0]+(d.hl?' · hiệu lực '+esc(d.hl):'')+'</div>'+
   (d.hs?'<div class="chk" style="border-color:'+(k?k[1]:'var(--hair)')+'"><b>Hồ sơ: '+esc(k?k[0]:'chưa đối chiếu')+'.</b> '+linkify(d.dc||'',d.id)+'</div>':'')+
   '<dl>'+r('Ban hành',esc(d.bh))+r('Hiệu lực',esc(d.hl))+r('Thay cho',linkify(d.thay,d.id))+r('Ghi chú',linkify(d.gc,d.id))+r('Từ khoá',esc(d.kw))+'</dl>'+
   related(d)+
   (d.src==='B'?'<p class="warn">Cần đối chiếu bản gốc: thông tin cuốn này lấy từ trang tổng hợp, hoặc chưa mở được trang gốc để xác nhận ngày tháng và tình trạng.</p>':'')+
   '<div class="pa">'+(url?'<a href="'+esc(url)+'" target="_blank" rel="noopener">Mở văn bản trên '+esc(host)+'</a>':'<span class="warn" style="border:0;padding:0">Chưa có link tới trang của văn bản này.</span>')+(state.ro?'':'<button class="q" data-edit="'+esc(d.id)+'">Sửa</button>')+'</div>';
  $('#panel').classList.add('on');
}
/* ---------- events ---------- */
function syncChips(){$$('#lvc .chip').forEach(function(c){c.setAttribute('aria-pressed',String(c.dataset.lv===lv))});$$('#flc .chip').forEach(function(c){c.setAttribute('aria-pressed',String(c.dataset.fl===fl))})}
function wire(){
  var qi=$('#q');
  qi.addEventListener('input',function(){q=qi.value.trim();apply();clearTimeout(auto);
    if(q&&list.length===1)auto=setTimeout(function(){if(list.length===1)open(list[0].id,true)},650)});
  qi.addEventListener('keydown',function(e){
    if(e.key==='ArrowDown'){e.preventDefault();moveSel(1)}
    else if(e.key==='ArrowUp'){e.preventDefault();moveSel(-1)}
    else if(e.key==='Enter'){e.preventDefault();var b=$$('#res [data-go]')[Math.max(ai,0)];if(b){open(b.dataset.go,true);$('#res').classList.remove('on')}}
    else if(e.key==='Escape'){if(qi.value){qi.value='';q='';apply()}else qi.blur()}
  });
  qi.addEventListener('focus',function(){if(q)$('#res').classList.add('on')});
  document.addEventListener('click',function(e){
    var go=e.target.closest('[data-go]');if(go){e.preventDefault();open(go.dataset.go,!!go.closest('#res'));if(go.closest('#res'))$('#res').classList.remove('on');return}
    var sp=e.target.closest('.spine');if(sp){if(sel===sp.dataset.id)close();else open(sp.dataset.id);return}
    if(e.target.closest('#px')){close();return}
    var ed=e.target.closest('[data-edit]');if(ed){openForm(ed.dataset.edit);return}
    if(!e.target.closest('.search'))$('#res').classList.remove('on');
  });
  $('#lvc').addEventListener('click',function(e){var b=e.target.closest('.chip');if(!b)return;lv=b.dataset.lv;syncChips();apply()});
  $('#flc').addEventListener('click',function(e){var b=e.target.closest('.chip');if(!b)return;fl=b.dataset.fl;syncChips();apply()});
  document.addEventListener('keydown',function(e){
    var typing=/INPUT|TEXTAREA|SELECT/.test((document.activeElement||{}).tagName||'');
    if(e.key==='/'&&!typing&&!$('#dlg').open){e.preventDefault();qi.focus();qi.select()}
    else if(e.key==='Escape'&&sel&&!typing&&!$('#dlg').open)close();
  });
  window.addEventListener('hashchange',fromHash);
  if($('#add'))$('#add').addEventListener('click',function(){openForm(null)});
  $('#f-x').addEventListener('click',function(){$('#dlg').close()});
  $('#f').addEventListener('submit',function(e){e.preventDefault();saveForm()});
  $('#f-del').addEventListener('click',function(){
    if(!delArm){delArm=true;this.textContent='Bấm lần nữa để xoá';return}
    state.docs=state.docs.filter(function(d){return d.id!==editing});if(sel===editing)close();$('#dlg').close();room();persist('Đã xoá.')});
}
function fromHash(){var h=decodeURIComponent((location.hash||'').slice(1));if(h&&byId(h)&&h!==sel)open(h)}
var F=['t','lv','so','ten','gay','bh','hl','st','src','thay','gc','kw','url','hs','dk','dc'];
function openForm(id){
  editing=id;delArm=false;
  var d=id?byId(id):{t:'tc',lv:'kt',st:'hl',src:'B'};
  F.forEach(function(k){$('#f-'+k).value=d[k]||''});
  $('#fh').textContent=id?'Sửa cuốn này':'Thêm một cuốn';
  $('#f-del').style.visibility=id?'visible':'hidden';$('#f-del').textContent='Xoá';
  $('#dlg').showModal();
}
function saveForm(){
  var d=editing?byId(editing):{id:'u'+Date.now().toString(36)};
  F.forEach(function(k){var v=$('#f-'+k).value.trim();if(v)d[k]=v;else delete d[k]});
  if(!editing)state.docs.push(d);
  $('#dlg').close();q='';$('#q').value='';lv='';fl='';syncChips();room();open(d.id);persist('Đã lưu.');
}
function toast(m){var t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(function(){t.style.display='none'},4200)}
function clean(){return {checked:state.checked,hoso:state.hoso,ro:state.ro,docs:state.docs.map(function(d){var o={};Object.keys(d).forEach(function(k){if(k.charAt(0)!=='_')o[k]=d[k]});return o})}}
function buildDoc(){
  var css=document.getElementById('css').textContent,js=document.getElementById('js').textContent;
  var json=JSON.stringify(clean()).replace(/</g,'\\u003c');
  var end='</'+'script>';
  return '<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>'+TITLE+'</title><link href="'+FONT+'" rel="stylesheet"><style id="css">'+css+'</style></head><body><div id="app"></div><script id="data" type="application/json">'+json+end+'<script id="js">'+js+end+'</body></html>';
}
function persist(okMsg){
  var tmp='Thay đổi chỉ giữ trong lần mở này: trang đang ở chế độ chỉ xem.';
  if(!window.claude||!window.claude.use){toast(tmp);return}
  Promise.resolve(art||window.claude.use('artifact')).then(function(a){
    art=a;if(!a){toast(tmp);return}
    toast('Đang lưu…');
    return a.publish(buildDoc()).then(function(){toast(okMsg)});
  }).catch(function(e){
    var c=String(e&&(e.code||e.message)||'');
    toast(/conflict/.test(c)?'Có bản mới hơn vừa được lưu. Trang sẽ tải lại, nhập lại thay đổi nhé.':tmp)});
}
shell();room();fromHash();
})();
</script></body></html>
